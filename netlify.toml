[build]
  publish = "public"
  command = "npm test && node scripts/prepare-pdf-viewer.mjs && node scripts/write-build-info.mjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["pdfjs-dist"]
  included_files = ["node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs"]

[[redirects]]
  from = "/api/plan"
  to = "/.netlify/functions/plan"
  status = 200
  force = true

[[redirects]]
  from = "/api/ai-status"
  to = "/.netlify/functions/ai-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/practical-priority"
  to = "/.netlify/functions/practical-priority"
  status = 200
  force = true

[[redirects]]
  from = "/api/weather"
  to = "/.netlify/functions/weather"
  status = 200
  force = true

[[redirects]]
  from = "/api/pdf-preview"
  to = "/.netlify/functions/pdf-preview"
  status = 200
  force = true

[[redirects]]
  from = "/api/grades"
  to = "/.netlify/functions/grades"
  status = 200
  force = true

[[redirects]]
  from = "/api/homework-helper"
  to = "/.netlify/functions/homework-helper"
  status = 200
  force = true

[[redirects]]
  from = "/api/account-config"
  to = "/.netlify/functions/account-config"
  status = 200
  force = true

[[redirects]]
  from = "/api/report-issue"
  to = "/.netlify/functions/report-issue"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin-reports"
  to = "/.netlify/functions/admin-reports"
  status = 200
  force = true

[[redirects]]
  from = "/api/report-review"
  to = "/.netlify/functions/report-review"
  status = 200
  force = true

[[redirects]]
  from = "/api/school-calendar"
  to = "/.netlify/functions/school-calendar"
  status = 200
  force = true

[[redirects]]
  from = "/api/source-health"
  to = "/.netlify/functions/source-health"
  status = 200
  force = true

[[redirects]]
  from = "/api/operations-health"
  to = "/.netlify/functions/operations-health"
  status = 200
  force = true

[[redirects]]
  from = "/api/digest-config"
  to = "/.netlify/functions/digest-config"
  status = 200
  force = true

[[redirects]]
  from = "/api/digest-send-test"
  to = "/.netlify/functions/digest-send-test"
  status = 200
  force = true

[[redirects]]
  from = "/api/child-access"
  to = "/.netlify/functions/child-access"
  status = 200
  force = true

[[redirects]]
  from = "/barn"
  to = "/barn/"
  status = 301

[[headers]]
  for = "/barn/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/api/child-access"
  [headers.values]
    Cache-Control = "no-store, private"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/drift/*"
  [headers.values]
    Cache-Control = "no-store, private"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/api/operations-health"
  [headers.values]
    Cache-Control = "private, no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "private, no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://qxejliyfgfeigvxsqupg.supabase.co; font-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/api/admin-reports"
  [headers.values]
    Cache-Control = "private, no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"

# Static asset caching: these script/style URLs are NOT content-hashed.
# Revalidate frequently to avoid serving old JS against a new HTML deploy.
# Do not add a blanket /api/* cache rule: authenticated endpoints stay private.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=120, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=120, must-revalidate"

[[headers]]
  for = "/*.mjs"
  [headers.values]
    Cache-Control = "public, max-age=120, must-revalidate"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/build-info.json"
  [headers.values]
    Cache-Control = "no-store"
