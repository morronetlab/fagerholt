[build]
  publish = "public"
  command = "npm test && node scripts/prepare-pdf-viewer.mjs && node scripts/write-build-info.mjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["pdfjs-dist"]
  included_files = ["node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs"]

[[redirects]]
  from = "/api/plan"
  to = "/.netlify/functions/plan"
  status = 200
  force = true

