[build]
  publish = "public"
  command = "npm test && node scripts/prepare-pdf-viewer.mjs && node scripts/write-build-info.mjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["pdfjs-dist"]
  included_files = ["node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs"]

[[redirects]]
  from = "/api/plan"
  to = "/.netlify/functions/plan"
  status = 200
  force = true

[[redirects]]
  from = "/api/ai-status"
  to = "/.netlify/functions/ai-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/weather"
  to = "/.netlify/functions/weather"
  status = 200
  force = true

[[redirects]]
  from = "/api/pdf-preview"
  to = "/.netlify/functions/pdf-preview"
  status = 200
  force = true

[[redirects]]
  from = "/api/grades"
  to = "/.netlify/functions/grades"
  status = 200
  force = true
