name: Inspect reported week 46 PDF sources (temporary)
on:
  pull_request:
    paths:
      - scripts/inspect-feedback-week46-temporary.mjs
      - .github/workflows/inspect-feedback-week46-temporary.yml
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/inspect-feedback-week46-temporary.mjs
