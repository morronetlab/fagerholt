name: Tests

# One validation per PR update; push builds only for main.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# Superseded runs for the same PR are cancelled.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Verify practical-email coverage against official live PDF (temporary)
        if: github.head_ref == 'fix/digest-practical-highlights'
        run: node scripts/verify-live-digest-highlights.mjs
      - name: Verify official Kristiansand school calendar HTML and distinct SFO dates
        # External municipality site may be blocked; never present a blocked
        # source as verified. Check this step result separately before merge.
        continue-on-error: true
        run: node scripts/verify-live-kristiansand-calendar.mjs
      - name: Compare critical practical facts with original school PDF binaries
        # External MinSkole hosts occasionally block CI; a failed attempt must
        # show as a warning, not be mistaken for a successfully inspected PDF.
        continue-on-error: true
        run: node scripts/verify-practical-original-pdfs.mjs
      - name: Verify current live homework response
        if: github.head_ref == 'fix/todda-live-homework-canonical'
        run: node scripts/inspect-todda-live.mjs
      # Targeted source-integrity check for the real PDF implicated in PR #53.
      - name: Verify original Tordenskjolds gate PDF
        if: ${{ github.event.pull_request.number == 53 }}
        run: node scripts/verify-todda-original-pdf.mjs

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
