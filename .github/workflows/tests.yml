name: Tests

# One validation per PR update; push builds only for main.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# Superseded runs for the same PR are cancelled.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      # Temporary one-off snapshot for pinned Chromium test dependency.
      - name: Generate browser dependency lock snapshot
        run: |
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact playwright@1.56.1 --no-audit --no-fund
          echo __BROWSER_LOCK_START__
          base64 -w0 package-lock.json
          echo
          echo __BROWSER_LOCK_END__
