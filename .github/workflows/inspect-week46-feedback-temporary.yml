name: Inspect new week 46 reports (temporary)
on:
  pull_request:
    paths:
      - scripts/inspect-week46-feedback-temporary.mjs
      - .github/workflows/inspect-week46-feedback-temporary.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/inspect-week46-feedback-temporary.mjs
