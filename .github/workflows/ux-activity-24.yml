name: "UX 2.4 – Mobil aktivitetsskjema"
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  ux-browser:
    if: github.head_ref == 'ux/skoleuka-24-mobile-activity-form'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      QA_BROWSER: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Mobil aktivitetsskjema – mobilregresjon
        run: node --test tests/browser/family-activity-mobile-24.test.mjs
