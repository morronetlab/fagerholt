name: Review official PDF sources (temporary)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/quality-original-pdf-review.yml'
      - 'scripts/collect-quality-originals.mjs'
      - 'tests/quality-original-source-collection.test.mjs'

permissions:
  contents: read

jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Verify safe read-only source collector
        run: node --test tests/quality-original-source-collection.test.mjs
      - name: Collect official PDF samples for manual review
        run: node scripts/collect-quality-originals.mjs quality-originals
      - name: Upload temporary source evidence for page-by-page human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-official-pdf-review
          path: quality-originals/
          if-no-files-found: error
          retention-days: 1
